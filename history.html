<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>占卜历史 · 增删卜易</title>
    <style>
        /* 与主页面风格一致的样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #e8f1f2;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(205, 224, 228, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 228, 232, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(195, 216, 220, 0.45) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 0%, rgba(210, 226, 230, 0.35) 0%, transparent 30%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* 太极阴阳鱼背景装饰 */
        body::before {
            content: '☯';
            position: fixed;
            font-size: 300px;
            color: rgba(255, 248, 240, 0.04);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: taijiSpin 60s linear infinite;
        }

        @keyframes taijiSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.2); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.2); }
        }

        /* 星点闪烁 */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(2px 2px at 10% 20%, rgba(255,255,240,0.15), transparent),
                radial-gradient(2px 2px at 30% 60%, rgba(255,255,240,0.1), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(255,255,240,0.2), transparent),
                radial-gradient(2px 2px at 70% 40%, rgba(255,255,240,0.12), transparent),
                radial-gradient(1px 1px at 90% 80%, rgba(255,255,240,0.18), transparent),
                radial-gradient(1px 1px at 15% 85%, rgba(255,255,240,0.08), transparent),
                radial-gradient(2px 2px at 60% 90%, rgba(255,255,240,0.1), transparent),
                radial-gradient(1px 1px at 85% 15%, rgba(255,255,240,0.15), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 840px;
            width: 100%;
            background: rgba(246, 239, 230, 0.92);
            backdrop-filter: blur(12px);
            padding: 30px 30px 40px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px #6b5a48 inset, 0 0 0 2px #bcab97 inset;
            border: 1px solid #c9b9a5;
        }
        h1 {
            font-size: 26px;
            text-align: center;
            font-weight: normal;
            letter-spacing: 8px;
            color: #3f2e1e;
            border-bottom: 2px solid #cbb8a4;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-bar a {
            color: #6b4f39;
            text-decoration: none;
            padding: 6px 18px;
            border-radius: 30px;
            background: #ede3d7;
            border: 1px solid #d5c6b4;
            font-size: 14px;
            transition: 0.2s;
        }
        .nav-bar a:hover { background: #d5c6b4; }
        .nav-bar a.active { background: #6b4f39; color: #f5ede4; border-color: #6b4f39; }
        .nav-bar a.external-link { background: #ede3d7; color: #6b4f39; border-color: #d5c6b4; }
        .nav-bar a.external-link:hover { background: #d5c6b4; color: #3f2e1e; border-color: #c2b39c; }
        .history-item {
            background: #fcf8f0;
            border-radius: 16px;
            padding: 0;
            margin-bottom: 12px;
            border: 1px solid #d5c6b4;
            transition: 0.2s;
            overflow: hidden;
            position: relative;
        }
        .history-item:hover { background: #f8f1e8; }
        .history-item .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
        }
        .history-item .header:hover { background: #f0e7d7; }
        .history-item .time { font-size: 13px; color: #7a6652; }
        .history-item .gua-name { font-weight: bold; font-size: 17px; color: #3f2e1e; }
        .history-item .gua-name .arrow { color: #b09a84; margin: 0 8px; }
        .history-item .question { font-size: 14px; color: #6b5844; font-style: italic; padding: 0 18px 12px; }
        .history-item .toggle-btn {
            border: 1px solid #8b6f4f;
            background: #ede3d7;
            color: #6b4f39;
            border-radius: 14px;
            padding: 2px 12px;
            font-size: 12px;
            font-family: inherit;
            line-height: 1.6;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .history-item .toggle-btn:hover { background: #d5c6b4; color: #3f2e1e; }
        .history-item.open .toggle-btn { background: #6b4f39; color: #f5ede4; border-color: #6b4f39; }
        .history-item .detail {
            display: none;
            padding: 0 18px 16px;
            border-top: 1px dashed #d5c6b4;
        }
        .history-item.open .detail { display: block; }
        .history-item .detail .user-block {
            background: linear-gradient(135deg, rgba(107, 79, 57, 0.08) 0%, rgba(180, 150, 120, 0.05) 100%);
            border-left: 3px solid #8b6f4f;
            border-radius: 8px;
            padding: 10px 14px;
            margin: 12px 0 10px;
            font-size: 13px;
            line-height: 1.9;
            color: #5a4632;
        }
        .history-item .detail .user-block .user-title {
            font-weight: bold;
            color: #3f2e1e;
            margin-bottom: 4px;
        }
        .history-item .detail .user-block .user-line {
            margin: 2px 0;
        }
        .history-item .detail .result-body {
            font-size: 14px;
            line-height: 1.8;
            color: #3c2e22;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .history-item .detail .model-tag {
            font-size: 12px;
            color: #9a8876;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #e0d3c4;
        }
        .history-item .detail .no-result {
            font-size: 13px;
            color: #b09a84;
            font-style: italic;
            padding: 8px 0;
        }
        .history-item .btn-delete-item {
            position: absolute;
            top: 12px;
            right: 14px;
            background: transparent;
            border: 1px solid #d5c6b4;
            color: #b09a84;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            line-height: 24px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            transition: 0.2s;
            z-index: 2;
        }
        .history-item .btn-delete-item:hover {
            background: #b33;
            color: #fff;
            border-color: #b33;
        }
        .history-item .header { padding-right: 50px; }
        .empty-state {
            text-align: center;
            color: #9a8876;
            padding: 50px 0;
            font-style: italic;
            letter-spacing: 2px;
        }
        .btn-clear {
            background: #b09a84;
            border: none;
            color: #2d241c;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 12px;
            transition: 0.2s;
        }
        .btn-clear:hover { background: #c0aa94; }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #a48d78;
            text-align: center;
            border-top: 1px solid #e0d3c4;
            padding-top: 16px;
            letter-spacing: 1px;
        }

        @media (max-width: 500px) {
            body { padding: 4px; }
            .container { padding: 8px; border-radius: 24px 24px 16px 16px; }
            h1 { font-size: 20px; letter-spacing: 4px; }
            /* 导航栏统一 3+3：每个按钮占 1/3 宽度，居中 */
            .nav-bar { gap: 6px; justify-content: center; }
            .nav-bar a {
                flex: 1 1 calc(33.33% - 8px);
                text-align: center;
                min-width: 0;
                font-size: 12px;
                padding: 6px 4px;
            }
            .history-item { padding: 14px; }
        }

        @media (max-width: 400px) {
            body { padding: 2px; }
            .container { padding: 6px; }
            h1 { font-size: 17px; letter-spacing: 2px; }
            .nav-bar a { font-size: 11px; padding: 5px 3px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 占卜 · 历史</h1>
    <div class="nav-bar">
        <a href="jiegou.html">🔮 起卦</a>
        <a href="jiegua.html">📜 释卦</a>
        <a href="history.html" class="active">📖 历史</a>
        <a href="help.html">❓ 指南</a>
        <a href="wnl.html" title="万年历">🗓️ 万年历</a>
        <a href="index.html" title="返回首页">🏠 首页</a>
    </div>
    <div id="historyList"></div>
    <div style="text-align:center;margin-top:12px;">
        <button class="btn-clear" id="clearHistoryBtn">🗑️ 清空历史</button>
    </div>
    <div class="footer-note">📖 以《增删卜易》为宗 · 占卜历史保存在本地</div>
</div>
<script>
    (function() {
        const historyList = document.getElementById('historyList');

        function loadHistory() {
            try {
                return JSON.parse(localStorage.getItem('guaHistory') || '[]');
            } catch(e) {
                return [];
            }
        }

        function renderHistory() {
            const history = loadHistory();
            if (history.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        🌿 暂无占卜记录<br>
                        <span style="font-size:13px;color:#b09a84;">起一卦，开启你的《增删卜易》之旅</span>
                    </div>
                `;
                return;
            }

            let html = '';
            // 倒序显示（最新的在前）
            for (let i = history.length - 1; i >= 0; i--) {
                const item = history[i];
                // 兼容旧数据：将起卦页遗留的占位文案「未记录」统一归一化为「未输入个人资料」
                if (item.question === '未记录') item.question = '未输入个人资料';
                if (item.userInfo && item.userInfo.question === '未记录') item.userInfo.question = '未输入个人资料';
                const userInfo = item.userInfo || {};
                const timeInfo = item.timeInfo || {};
                const hasResult = item.result && item.result.length > 0;
                html += `
                    <div class="history-item" data-idx="${i}">
                        <button class="btn-delete-item" title="删除此条记录" aria-label="删除">🗑️</button>
                        <div class="header" onclick="toggleHistoryDetail(this)">
                            <span class="gua-name">
                                ${escapeHtml(item.benGua)} <span class="arrow">→</span> ${escapeHtml(item.bianGua)}
                            </span>
                            <span style="display:flex;align-items:center;gap:6px;">
                                <span class="time">${escapeHtml(item.time || '未知时间')}</span>
                                <button type="button" class="toggle-btn">查看</button>
                            </span>
                        </div>
                        <div class="question">📌 ${escapeHtml(item.question || '未输入个人资料')}</div>
                        <div class="detail">
                            <div class="user-block">
                                <div class="user-title">🧘 求卦者资料</div>
                                <div class="user-line">👤 姓名：${escapeHtml(userInfo.name || '匿名')}　性别：${escapeHtml(userInfo.gender || '未知')}</div>
                                <div class="user-line">⏰ 出生时辰：${escapeHtml(userInfo.birth || '未输入个人资料')}</div>
                                <div class="user-line">📅 起卦时间：${escapeHtml(timeInfo.solarTime || item.time || '—')}（公历）${escapeHtml(timeInfo.lunarTime || '—')}（农历）</div>
                                <div class="user-line">🌙 月建：${escapeHtml(timeInfo.yueJian || '—')}月　☀️ 日辰：${escapeHtml(timeInfo.riChen || '—')}日　🌀 旬空：${escapeHtml(timeInfo.xunKong || '—')}</div>
                                <div class="user-line">⚡ 动爻：${item.dongYao && item.dongYao.length > 0 ? escapeHtml(item.dongYao.join('、')) : '无动爻（静卦）'}</div>
                                <div class="user-line">❓ 所问：${escapeHtml(userInfo.question || item.question || '未输入个人资料')}</div>
                            </div>
                            ${hasResult
                                ? `<div class="result-body">${escapeHtml(item.result)}</div>
                                   <div class="model-tag">🤖 AI 解读（${escapeHtml(item.modelName || '千问/GLM')}） · 仅供娱乐参考</div>`
                                : '<div class="no-result">📜 尚未释卦（可点击本条回起卦页排盘后回到「释卦」页生成 AI 解读）</div>'}
                        </div>
                    </div>
                `;
            }
            historyList.innerHTML = html;
        }

        // HTML 转义
        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // 切换历史详情折叠/展开，并同步按钮文字
        window.toggleHistoryDetail = function(headerEl) {
            const item = headerEl.parentElement;
            const isOpen = item.classList.toggle('open');
            const btn = item.querySelector('.toggle-btn');
            if (btn) btn.textContent = isOpen ? '隐藏' : '查看';
        };

        // 清空历史
        document.getElementById('clearHistoryBtn').addEventListener('click', function() {
            if (confirm('确定要清空所有占卜历史吗？')) {
                localStorage.removeItem('guaHistory');
                renderHistory();
            }
        });

        // 删除单条历史（事件委托，避免与 header 展开冲突）
        historyList.addEventListener('click', function(e) {
            const delBtn = e.target.closest('.btn-delete-item');
            if (!delBtn) return;
            e.stopPropagation();
            const itemEl = delBtn.closest('.history-item');
            if (!itemEl) return;
            const idx = parseInt(itemEl.dataset.idx, 10);
            if (isNaN(idx)) return;
            if (!confirm('确定要删除这条占卜记录吗？')) return;
            const history = loadHistory();
            if (idx < 0 || idx >= history.length) {
                alert('记录已不存在');
                renderHistory();
                return;
            }
            history.splice(idx, 1);
            localStorage.setItem('guaHistory', JSON.stringify(history));
            renderHistory();
        });

        renderHistory();
        console.log('✅ 历史记录页面已加载');
    })();
</script>
</body>
</html>
