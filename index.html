<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>增删卜易 · 数字系统</title>
<style>
  :root{
    --ink:#2c2417; --gold:#9a7b3f; --paper:#FFFEFC; --line:#d9c9a3;
    --card:#fffdf6; --accent:#7a1f1f;
    /* 道玄文集主站青瓷色系 */
    --jade:#eef3f2; --jade-line:#D1D9D9; --jade-ink:#5A4A3F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Songti SC","SimSun",serif;
    /* 与内容页（yangshi.css）一致的青瓷渐变背景 */
    background:#e8f1f2;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(205, 224, 228, 0.5) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(212, 228, 232, 0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(195, 216, 220, 0.45) 0%, transparent 40%),
      radial-gradient(ellipse at 50% 0%, rgba(210, 226, 230, 0.35) 0%, transparent 30%);
    color:var(--jade-ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:48px 20px; position:relative; overflow-x:hidden;
  }
  /* 太极阴阳鱼：置于卡片上层、透明淡显、不拦截点击 */
  body::before{
    content:'☯';
    position:fixed; font-size:126px; color:rgba(122, 31, 31, 0.2);
    top:50%; left:50%; transform:translate(-50%,-50%) scale(1.4);
    pointer-events:none; z-index:3; animation:taijiSpin 60s linear infinite;
  }
  @keyframes taijiSpin{
    0%{transform:translate(-50%,-50%) scale(1.4) rotate(0deg);}
    100%{transform:translate(-50%,-50%) scale(1.4) rotate(360deg);}
  }
  /* 居中内容列，浮于背景装饰之下（装饰 z-index:3 位于其上） */
  .page{
    width:100%; max-width:880px;
    display:flex; flex-direction:column; align-items:stretch;
    position:relative; z-index:1;
  }
  .masthead{text-align:center; margin-bottom:30px}
  .masthead h1{font-size:34px; letter-spacing:6px; color:var(--accent)}
  .masthead p{margin-top:10px; color:var(--gold); font-size:15px; letter-spacing:3px}
  /* 卡片容器：与内容页 .container 一致的米色半透明圆角面板 + 双描边 + 深投影 */
  .entry-panel{
    background:rgba(246, 239, 230, 0.92);
    backdrop-filter:blur(12px);
    border:1px solid #c9b9a5;
    border-radius:48px 48px 32px 32px;
    padding:28px 24px;
    box-shadow:0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px #6b5a48 inset, 0 0 0 2px #bcab97 inset;
  }
  /* 桌面端三列对称网格（6 卡 = 3×2） */
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:18px; width:100%;
  }
  @media (max-width:680px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:460px){ .grid{grid-template-columns:1fr} }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:22px 20px; text-decoration:none; color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 2px 6px rgba(120,90,30,.08);
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(120,90,30,.16)}
  .card .ico{font-size:26px}
  .card h2{font-size:19px; margin:12px 0 6px; color:var(--accent); letter-spacing:1px}
  .card p{font-size:13px; color:#6b5d44; line-height:1.6}

  /* 乾坤卦象（六爻线绘制） */
  .guaxiang{display:flex; flex-direction:column; gap:4px; width:44px}
  .guaxiang .y{display:block; height:5px; width:100%; border-radius:3px; background:var(--accent)}
  .guaxiang .y.yin{background:transparent; position:relative}
  .guaxiang .y.yin::before,
  .guaxiang .y.yin::after{content:''; position:absolute; top:0; height:5px; width:42%; border-radius:3px; background:var(--accent)}
  .guaxiang .y.yin::before{left:0}
  .guaxiang .y.yin::after{right:0}
  /* 乾坤合并卡：两卦并排 */
  .guaxiang-pair{display:flex; gap:18px; justify-content:center; margin:8px 0 6px}
  .gx{display:flex; flex-direction:column; align-items:center; gap:6px}
  .gx span{font-size:13px; color:var(--accent); font-weight:700; letter-spacing:3px}

  /* 落款：单行版权 + 道玄文集内链 */
  .foot{margin-top:30px; text-align:center; font-size:12.5px; color:var(--gold); letter-spacing:.5px; line-height:1.8}
  .foot .hl{color:var(--accent); font-weight:700; text-decoration:none; border-bottom:1px solid var(--accent); padding:0 2px}
  .foot .hl:hover{opacity:.8}
</style>
</head>
<body>
  <div class="page">
    <div class="masthead">
      <h1>增删卜易</h1>
      <p>数字系统</p>
    </div>

    <div class="entry-panel">
      <div class="grid">
        <a class="card" href="jiegou.html">
          <div class="ico">☯</div>
          <h2>起卦</h2>
          <p>铜钱摇卦 / 手动输卦，八宫纳甲排盘，本卦变卦世应动爻一目了然。</p>
        </a>
        <a class="card" href="jiegua.html">
          <div class="ico">📜</div>
          <h2>释卦</h2>
          <p>AI 解读卦象，旺衰格局、用神取舍、应期提示，古法推演供参考。</p>
        </a>
        <a class="card" href="wnl.html">
          <div class="ico">📅</div>
          <h2>万年历</h2>
          <p>农历干支、节气旬空、真太阳时、断卦参数，通书随身。</p>
        </a>
        <a class="card" href="history.html">
          <div class="ico">📚</div>
          <h2>历史</h2>
          <p>历次占验记录（本地存储），折叠检索，便于复盘。</p>
        </a>
        <a class="card" href="help.html">
          <div class="ico">❓</div>
          <h2>使用指南</h2>
          <p>起卦、排盘、释卦全流程说明与注意事项。</p>
        </a>
        <a class="card" href="jiegou.html">
          <h2>乾坤 · 两仪</h2>
          <div class="guaxiang-pair">
            <div class="gx">
              <div class="guaxiang"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i></div>
              <span>乾</span>
            </div>
            <div class="gx">
              <div class="guaxiang"><i class="y yin"></i><i class="y yin"></i><i class="y yin"></i><i class="y yin"></i><i class="y yin"></i><i class="y yin"></i></div>
              <span>坤</span>
            </div>
          </div>
          <p>纯阳之首，刚健中正<br>纯阴之母，柔顺承载</p>
        </a>
      </div>
    </div>

    <div class="foot">
      © 2026 增删卜易 · 数字系统由 <a class="hl" href="https://dxwj.pages.dev/" target="_blank" rel="noopener">道玄文集</a> 维护
    </div>
  </div>
</body>
</html>
