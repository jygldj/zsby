<style>
  :root{

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Songti SC","SimSun",serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;

  .grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px; width:100%; max-width:880px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:24px 22px; text-decoration:none; color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 2px 6px rgba(120,90,30,.08);
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(120,90,30,.16)}
  .card .ico{font-size:26px}
  .card h2{font-size:19px; margin:12px 0 6px; color:var(--accent); letter-spacing:1px}
  .card p{font-size:13px; color:#6b5d44; line-height:1.6}
  .foot{margin-top:40px; font-size:12px; color:var(--gold)}
  .foot a{color:var(--gold); text-decoration:none; border-bottom:1px dashed var(--gold)}
