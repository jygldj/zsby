<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>天时通鉴 · 增删卜易</title>
    <link rel="stylesheet" href="ly/yangshi.css">
    <style>
        /* ===== 天时通鉴·容器覆盖 ===== */
        .container.tstj-container {
            max-width: 1380px;
            padding: 26px 26px 36px;
            align-self: flex-start;
        }

        /* ===== 三栏布局 ===== */
        .tstj-layout {
            display: grid;
            grid-template-columns: 340px 1fr 340px;
            gap: 16px;
            margin-bottom: 16px;
        }
        .tstj-left, .tstj-center, .tstj-right {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ===== 左栏：沿用 wnl 旧样式 ===== */
        .jieqi-bar {
            background: linear-gradient(90deg, #f6efe6, #fcf8f0, #f6efe6);
            border: 1px solid #e0d3c4;
            border-radius: 14px;
            padding: 10px 8px;
            text-align: center;
            font-size: 13px;
            color: #5a4632;
            margin-bottom: 0;
            letter-spacing: 0;
            min-height: 40px;
            display: flex; align-items: center; justify-content: center;
            flex-wrap: nowrap; white-space: nowrap;
            gap: 2px;
            overflow: hidden;
        }
        .jieqi-bar .jq-name { color: #b33a2a; font-weight: bold; }
        .jieqi-bar .jq-sub { color: #8a765d; font-size: 12px; }
        @media (max-width: 400px) {
            .jieqi-bar { font-size: 11px; padding: 10px 4px; }
            .jieqi-bar .jq-sub { font-size: 10px; }
        }

        .date-input-wrapper {
            background: #fcf8f0;
            border: 1px solid #d5c6b4;
            border-radius: 18px;
            padding: 14px 16px;
        }
        .date-input-wrapper .rtitle {
            font-size: 12px; color: #7a6652; letter-spacing: 2px; margin-bottom: 8px;
        }
        .date-input-row {
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .date-input {
            text-align: center; font-size: 24px; font-family: 'Georgia', serif;
            border: 1px solid #cbb8a4; border-radius: 10px; background: #fff;
            color: #3f2e1e; padding: 10px 6px; -webkit-appearance: none; appearance: none;
        }
        .date-input:focus { outline: none; border-color: #6b4f39; box-shadow: 0 0 0 2px rgba(107,79,57,0.15); }
        .date-input.year { width: 104px; letter-spacing: 2px; }
        .date-input.md { width: 64px; }
        .date-sep { font-size: 26px; color: #8a765d; font-weight: bold; user-select: none; }
        .date-note { margin-top: 8px; font-size: 12px; color: #a48d78; text-align: center; letter-spacing: 0.5px; line-height: 1.4; }

        .row-card {
            background: rgba(255,248,240,0.6);
            border: 1px solid #d5c6b4;
            border-radius: 16px;
            padding: 12px 16px;
        }
        .row-card .rtitle { font-size: 12px; color: #7a6652; letter-spacing: 2px; margin-bottom: 8px; }
        .time-row, .loc-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        select {
            padding: 9px 10px; font-size: 16px; border-radius: 10px;
            border: 1px solid #cbb8a4; background: #fcf8f0; font-family: inherit;
            color: #3c2e22; -webkit-appearance: none; appearance: none; padding-right: 8px;
        }
        .time-row select { width: 64px; text-align-last: center; }
        .loc-status { font-size: 14px; color: #5a4632; flex: 1; min-width: 0; line-height: 1.4; }
        .loc-status.success { color: #2d7a3d; font-weight: bold; }
        .loc-status.loading::after {
            content: ''; display: inline-block; width: 10px; height: 10px;
            border: 2px solid #6b4f39; border-top-color: transparent; border-radius: 50%;
            animation: spin 0.7s linear infinite; margin-left: 6px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            background: #b09a84; border: 1px solid #c9b49e; color: #2d241c;
            padding: 9px 16px; border-radius: 30px; font-size: 14px; cursor: pointer;
            font-family: inherit; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.06); white-space: nowrap;
        }
        .btn:hover { background: #c0aa94; }
        .btn-primary { background: #6b4f39; color: #f5ede4; border-color: #8f745b; box-shadow: 0 3px 0 #3d2d1f; }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 0 0 #3d2d1f; }
        .btn-qigua {
            background: #6b4f39; color: #f5ede4; border: 1px solid #8f745b;
            padding: 12px 20px; border-radius: 60px; font-size: 16px; font-weight: bold;
            letter-spacing: 4px; cursor: pointer; font-family: inherit; transition: 0.2s;
            box-shadow: 0 4px 0 #3d2d1f; text-align: center;
        }
        .btn-qigua:hover { background: #7d5d43; transform: translateY(-2px); }
        .btn-qigua:active { transform: translateY(2px); box-shadow: 0 1px 0 #3d2d1f; }

        .result-area {
            background: #fcf8f0; border: 1px solid #d5c6b4; border-radius: 18px;
            padding: 16px; min-height: 80px;
        }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .result-card {
            background: #f6efe6; border: 1px solid #e0d3c4; border-radius: 12px; padding: 10px 14px;
        }
        .result-card .label { font-size: 11px; color: #7a6652; letter-spacing: 2px; margin-bottom: 3px; }
        .result-card .value { font-size: 18px; font-weight: bold; color: #3f2e1e; }
        .result-card .value.small { font-size: 15px; }
        .result-card .value .hl { color: #6b4f39; }
        .result-card .value .yuejian { color: #b33; font-weight: bold; }
        .result-card .value .richen { color: #3366aa; font-weight: bold; }
        .result-card .value .xunkong { color: #999; }
        .result-card .value .yuepo { color: #b33; font-weight: bold; }
        .result-card .value .richong { color: #e67e22; font-weight: bold; }
        .result-card.full { grid-column: 1 / -1; }
        .info-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
        .info-label { font-size: 13px; color: #7a6652; white-space: nowrap; min-width: 72px; }
        .info-value { font-size: 16px; font-weight: bold; color: #3f2e1e; }
        .pillar-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
        .pillar-label { font-size: 13px; color: #7a6652; white-space: nowrap; min-width: 58px; }
        .pillar-gz { font-size: 18px; font-weight: bold; color: #3f2e1e; }
        .na-yin { font-size: 13px; color: #7a6652; margin-left: 4px; }
        .card-divider { border-top: 1px dashed #e0d3c4; margin: 6px 0; }
        .liu-section { margin-top: 6px; }
        .liu-title { font-size: 13px; color: #7a6652; margin-bottom: 3px; }
        .liu-shen-list { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; font-weight: bold; color: #3f2e1e; line-height: 1.7; }
        .liu-qin-list { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: #3f2e1e; line-height: 1.7; }
        .liu-qin-list .lq-label { color: #7a6652; font-size: 12px; }
        .loc-card { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .loc-card .loc-title { font-size: 14px; font-weight: bold; color: #3f2e1e; white-space: nowrap; }
        .loc-card .loc-hint { font-size: 12px; color: #7a6652; white-space: nowrap; }
        .json-box {
            margin-top: 12px; background: #2d241c; color: #d6c8b8; border-radius: 10px;
            padding: 10px 12px; font-size: 12px; font-family: 'Consolas', monospace;
            white-space: pre-wrap; word-break: break-all; line-height: 1.5;
        }

        /* ===== 中栏：今日/日历/应期 三卡片 ===== */
        .today-card {
            background: #f6efe6; border: 1px solid #d5c6b4; border-radius: 14px;
            padding: 14px 16px; margin-bottom: 12px; text-align: center;
        }
        .btn-today {
            background: #b33a2a; border: none; color: #fff;
            padding: 10px 28px; border-radius: 30px; font-size: 15px; font-weight: bold;
            cursor: pointer; font-family: inherit; transition: 0.2s;
            box-shadow: 0 2px 6px rgba(179,58,42,0.25);
        }
        .btn-today:hover { background: #c94a38; transform: translateY(-1px); }
        .today-hint { font-size: 12px; color: #7a6652; margin-top: 6px; }
        .calendar-card {
            background: #fcf8f0; border: 1px solid #d5c6b4; border-radius: 14px; padding: 12px;
            margin-bottom: 12px;
        }
        .calendar-card .calendar-header {
            background: transparent; border: none; border-radius: 0;
            padding: 0 4px 10px;
        }

        /* ===== 中栏：日历网格 ===== */
        .calendar-header {
            display: flex; align-items: center; justify-content: space-between;
            background: #f6efe6; border: 1px solid #d5c6b4; border-radius: 14px;
            padding: 10px 16px;
        }
        .cal-nav-btn {
            background: #b09a84; border: 1px solid #c9b49e; color: #2d241c;
            padding: 6px 14px; border-radius: 30px; font-size: 14px; cursor: pointer;
            font-family: inherit; transition: 0.2s; white-space: nowrap;
        }
        .cal-nav-btn:hover { background: #c0aa94; }
        .cal-title { font-size: 18px; font-weight: bold; color: #3f2e1e; letter-spacing: 2px; white-space: nowrap; flex: 1; text-align: center; min-width: 0; }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
            background: #fcf8f0; border: 1px solid #d5c6b4; border-radius: 14px; padding: 10px;
        }
        .cal-weekday {
            text-align: center; font-size: 13px; font-weight: bold; color: #7a6652;
            padding: 6px 0; letter-spacing: 1px;
        }
        .cal-weekday.sun { color: #b33; }
        .cal-weekday.sat { color: #3366aa; }
        .cal-cell {
            aspect-ratio: 1 / 1.15; border: 1px solid #e8dccc; border-radius: 8px;
            padding: 4px 6px; cursor: pointer; transition: 0.15s; position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
            background: #fffdf9; overflow: hidden;
        }
        .cal-cell:hover { border-color: #6b4f39; box-shadow: 0 2px 8px rgba(107,79,57,0.12); }
        .cal-cell.other-month { opacity: 0.35; }
        .cal-cell.today { border: 2px solid #b33a2a; }
        .cal-cell.selected { border: 2px solid #6b4f39; background: #f6efe6; }
        .cal-cell.yingqi-match {
            border: 2px solid #d4a017; background: #fffaef;
            box-shadow: 0 0 8px rgba(212,160,23,0.3);
        }
        .cal-cell.yingqi-match.selected { border: 2px solid #6b4f39; background: #f6efe6; box-shadow: 0 0 8px rgba(212,160,23,0.4); }
        .cal-cell.zeji-match {
            border: 2px solid #2980b9; background: #eff7fc;
            box-shadow: 0 0 6px rgba(41,128,185,0.2);
        }
        .cal-cell.zeji-match.selected { border: 2px solid #6b4f39; background: #f6efe6; }
        .cal-solar { font-size: 15px; font-weight: bold; color: #3f2e1e; line-height: 1; }
        .cal-lunar { font-size: 11px; color: #8a765d; line-height: 1.2; }
        .cal-jieqi { font-size: 10px; color: #2d7a3d; font-weight: bold; line-height: 1.2; }
        .cal-badge {
            position: absolute; top: 2px; right: 2px;
            background: #d4a017; color: #fff; font-size: 9px; font-weight: bold;
            padding: 1px 4px; border-radius: 8px; line-height: 1.2;
        }

        /* ===== 应期反查结果列表 ===== */
        .yingqi-section {
            background: #fcf8f0; border: 1px solid #d5c6b4; border-radius: 14px; padding: 12px 16px;
        }
        .yingqi-title { font-size: 15px; font-weight: bold; color: #3f2e1e; margin-bottom: 8px; }
        .yingqi-list { display: flex; flex-direction: column; gap: 4px; }
        .yingqi-item {
            display: grid; grid-template-columns: 30px 1fr 50px 1fr 50px 60px; gap: 8px;
            align-items: center; padding: 6px 10px; border-radius: 8px;
            background: #f6efe6; border: 1px solid #e8dccc; font-size: 13px; cursor: pointer; transition: 0.15s;
        }
        .yingqi-item:hover { border-color: #6b4f39; background: #f0e8da; }
        .yingqi-item .yi-idx { font-weight: bold; color: #7a6652; }
        .yingqi-item .yi-date { color: #3f2e1e; font-weight: bold; }
        .yingqi-item .yi-week { color: #7a6652; font-size: 12px; }
        .yingqi-item .yi-lunar { color: #8a765d; font-size: 12px; }
        .yingqi-item .yi-gz { color: #6b4f39; font-weight: bold; }
        .yingqi-item .yi-diff { text-align: right; color: #b33a2a; font-weight: bold; font-size: 12px; }

        /* ===== 右栏：黄历通书 ===== */
        .huangli-panel {
            background: #fcf8f0; border: 1px solid #d5c6b4; border-radius: 18px;
            padding: 14px; display: flex; flex-direction: column; gap: 10px;
        }
        .hl-card {
            background: #f6efe6; border: 1px solid #e8dccc; border-radius: 12px; padding: 10px 14px;
        }
        .hl-card-title {
            font-size: 13px; font-weight: bold; color: #7a6652; letter-spacing: 2px;
            margin-bottom: 6px; border-bottom: 1px dashed #e0d3c4; padding-bottom: 4px;
        }
        .hl-ganzi-row { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; }
        .hl-ganzi-label { font-size: 12px; color: #7a6652; }
        .hl-ganzi-val { font-size: 16px; font-weight: bold; color: #3f2e1e; }
        .hl-ganzi-val .ny { font-size: 12px; color: #7a6652; font-weight: normal; margin-left: 3px; }
        .hl-yi { background: #f0f8ee; border-color: #c5e0b8; }
        .hl-yi .hl-card-title { color: #2d7a3d; border-bottom-color: #c5e0b8; }
        .hl-yi-content { font-size: 14px; color: #3f2e1e; line-height: 1.7; }
        .hl-ji { background: #fdf2f0; border-color: #e8c5bf; }
        .hl-ji .hl-card-title { color: #b33a2a; border-bottom-color: #e8c5bf; }
        .hl-ji-content { font-size: 14px; color: #3f2e1e; line-height: 1.7; }
        .hl-jishen-content { font-size: 13px; color: #2d7a3d; line-height: 1.7; }
        .hl-xionsha-content { font-size: 13px; color: #b33a2a; line-height: 1.7; }
        .hl-chong-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; }
        .hl-chong-label { color: #7a6652; }
        .hl-chong-val { font-weight: bold; color: #3f2e1e; }
        .hl-xiu-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; }
        .hl-xiu-song { font-size: 12px; color: #8a765d; line-height: 1.5; margin-top: 4px; }
        .hl-pengzu { font-size: 13px; color: #5a4632; line-height: 1.6; }
        .hl-position-table { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .hl-pos-item { display: flex; justify-content: space-between; padding: 2px 6px; background: #fffdf9; border-radius: 6px; font-size: 13px; }
        .hl-pos-label { color: #7a6652; }
        .hl-pos-val { font-weight: bold; color: #3f2e1e; }
        .hl-jianchu { font-size: 16px; font-weight: bold; color: #6b4f39; text-align: center; padding: 4px 0; }
        .hl-jieqi-info { font-size: 13px; color: #5a4632; line-height: 1.6; }
        .hl-placeholder { color: #9a8876; text-align: center; padding: 40px 0; font-style: italic; letter-spacing: 2px; font-size: 15px; }

        /* ===== 择吉助手（二期预留） ===== */
        .zeji-section {
            background: #fcf8f0; border: 1px dashed #d5c6b4; border-radius: 14px; padding: 12px 16px;
        }
        .zeji-title { font-size: 14px; font-weight: bold; color: #7a6652; margin-bottom: 8px; }
        .zeji-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .zeji-row select { flex: 1; min-width: 120px; }
        .zeji-hint { font-size: 12px; color: #a48d78; margin-top: 6px; }

        .footer-note { margin-top: 16px; font-size: 12px; color: #a48d78; text-align: center; border-top: 1px solid #e0d3c4; padding-top: 12px; letter-spacing: 1px; }

        /* ===== 手机端 Bottom Sheet ===== */
        .mobile-bar { display: none; }
        .sheet-backdrop { display: none; }

        @media (max-width: 900px) {
            /* 解除 .container 对 fixed 子元素（遮罩/浮层）的包含块捕获：
               原 .container 带 backdrop-filter，会令内部 fixed 浮层相对容器而非视口，
               导致遮罩覆盖整页、内容Sheet被推到页底视口外。仅手机端取消，桌面玻璃感不变。 */
            .container { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
            /* 底部悬浮栏：始终可见 */
            .mobile-bar {
                display: flex; position: fixed; bottom: 0; left: 50%;
                transform: translateX(-50%) translateZ(0);
                width: calc(100% - 16px); max-width: 560px;
                background: rgba(253, 249, 243, 0.98); backdrop-filter: blur(12px);
                border: 1px solid #d5c6b4; border-bottom: none;
                border-radius: 20px 20px 0 0;
                padding: 8px 8px;
                padding-bottom: max(10px, env(safe-area-inset-bottom), constant(safe-area-inset-bottom));
                gap: 6px;
                z-index: 9999;
                box-shadow: 0 -6px 22px rgba(0,0,0,0.16);
                will-change: transform;
            }
            .mobile-bar-btn {
                flex: 1; padding: 10px 2px; border: 1px solid #d5c6b4;
                border-radius: 14px; background: #fffdf9; font-size: 13px;
                cursor: pointer; font-family: inherit; color: #3f2e1e;
                transition: 0.15s; text-align: center; font-weight: 600;
            }
            .mobile-bar-btn:active { transform: scale(0.95); }
            .mobile-bar-btn.active { background: #6b4f39; color: #f5ede4; border-color: #6b4f39; }

            /* 遮罩层 */
            .sheet-backdrop {
                display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.45); z-index: 1000; animation: fadeInBg 0.2s ease;
            }
            .sheet-backdrop.active { display: block; }
            @keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }

            /* Sheet 通用样式：默认隐藏，激活时从底部滑出 */
            .mobile-sheet {
                display: none !important; /* 手机端默认隐藏，不占空间 */
            }
            .mobile-sheet.sheet-active {
                display: block !important;
                position: fixed; bottom: 0; left: 0; right: 0;
                max-height: 78vh; overflow-y: auto; overflow-x: hidden;
                background: #fcf8f0; border-radius: 20px 20px 0 0;
                box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
                z-index: 1001; padding: 16px 14px;
                border: 1px solid #d5c6b4; border-bottom: none;
                animation: sheetSlideUp 0.28s ease;
                padding-bottom: max(16px, calc(env(safe-area-inset-bottom) + 60px));
            }
            @keyframes sheetSlideUp {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }

            /* 关闭按钮样式 */
            .sheet-close-btn {
                text-align: right; font-size: 13px; color: #7a6652;
                margin-bottom: 8px; cursor: pointer; padding: 2px 8px;
            }
        }

        /* ===== 响应式：平板 ===== */
        @media (max-width: 900px) {
            .tstj-layout { grid-template-columns: 1fr; }
            .tstj-left { order: 1; }
            .tstj-center { order: 2; }
            .tstj-right { order: 3; }
            .container.tstj-container { padding-bottom: 76px; } /* 防底部浮动栏遮挡内容 */
        }

        /* ===== 响应式：手机 ===== */
        @media (max-width: 500px) {
            body { padding: 4px; }
            .container.tstj-container { padding: 12px 10px 18px; border-radius: 24px 24px 16px 16px; }
            h1 { font-size: 19px; letter-spacing: 4px; }
            .nav-bar { gap: 5px; }
            .nav-bar a { flex: 1 1 calc(25% - 6px); text-align: center; min-width: 0; font-size: 11px; padding: 5px 3px; }
            .date-input { font-size: 22px; padding: 12px 6px; }
            .date-input.year { width: 92px; }
            .date-input.md { width: 58px; }
            .date-sep { font-size: 22px; }
            .result-grid { grid-template-columns: 1fr; }
            .time-row select { width: 56px; }
            .loc-card { gap: 6px; }
            .loc-card .loc-title { font-size: 13px; }
            .loc-card .loc-hint { font-size: 11px; }
            .info-row { padding: 2px 0; }
            .pillar-row { padding: 2px 0; }
            .info-value { font-size: 14px; }
            .pillar-gz { font-size: 16px; }
            .liu-shen-list { font-size: 14px; gap: 4px 10px; }
            .liu-qin-list { font-size: 13px; gap: 4px 10px; }
            .cal-cell { padding: 2px 3px; }
            .cal-solar { font-size: 13px; }
            .cal-lunar { font-size: 10px; }
            .cal-jieqi { font-size: 9px; }
            .yingqi-item { grid-template-columns: 24px 1fr 44px 1fr 44px 50px; gap: 4px; font-size: 12px; }

    // ============ 工具：真太阳时 ============
    function equationOfTime(dayOfYear){
        var B = 2 * Math.PI * (dayOfYear - 81) / 365;
        return 9.87 * Math.sin(2*B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    }
    function trueSolarTime(y, m, d, h, mi, lng){
        var bjMin = h*60 + mi;
        var lonCorr = (lng - 120) * 4;
        var dim = [31,28,31,30,31,30,31,31,30,31,30,31];
        var isLeap = (y%4===0 && y%100!==0) || (y%400===0);
        if(isLeap) dim[1]=29;
        var doy = 0;
        for(var i=0;i<m-1;i++) doy += dim[i];
        doy += d;
        var eot = equationOfTime(doy);
        var ztMin = bjMin + lonCorr + eot;
        ztMin = ((ztMin % 1440) + 1440) % 1440;
        var ztH = Math.floor(ztMin/60);
        var ztMi = Math.floor(ztMin%60);
        var ztS = Math.round((ztMin - Math.floor(ztMin))*60);
        if(ztS>=60){ ztS-=60; ztMi+=1; }
        if(ztMi>=60){ ztMi-=60; ztH+=1; }
        ztH = ztH % 24;
        var p2 = function(n){ return n<10?'0'+n:''+n; };
        return { h: ztH, mi: ztMi, s: ztS, text: p2(ztH)+':'+p2(ztMi)+':'+p2(ztS) };
    }

    // ============ 工具：农历 ============
    function lunarOf(y,m,d){
        return Solar.fromYmd(y,m,d).getLunar();
    }

    // ============ 日期输入框逻辑 ============
    function daysInMonth(y, m){
        var dim = [31,28,31,30,31,30,31,31,30,31,30,31];
        var isLeap = (y%4===0 && y%100!==0) || (y%400===0);
        if(isLeap && m===2) return 29;
        return dim[m-1];
    }
    function onlyDigits(v, max){ return v.replace(/\D/g, '').slice(0, max); }
    function padField(input, maxLen){
        var v = input.value.replace(/\D/g, '');
        if(v.length === 0) return;
        var n = parseInt(v, 10);
        if(isNaN(n)) return;
        if(input === inpYear){
            if(n < YEAR_MIN) n = YEAR_MIN;
            if(n > YEAR_MAX) n = YEAR_MAX;
        }else if(input === inpMonth){
            if(n < 1) n = 1;
            if(n > 12) n = 12;
        }else if(input === inpDay){
            var y = parseInt(inpYear.value, 10);
            var m = parseInt(inpMonth.value, 10);
            if(!isNaN(y) && !isNaN(m)){
                var maxD = daysInMonth(y, m);
                if(n < 1) n = 1;
                if(n > maxD) n = maxD;
            }else{
                if(n < 1) n = 1;
                if(n > 31) n = 31;
            }
        }
        var s = String(n);
        while(s.length < maxLen) s = '0' + s;
        input.value = s;
    }
    function tryUpdateFromInput(){
        var y = parseInt(inpYear.value, 10);
        var m = parseInt(inpMonth.value, 10);
        var d = parseInt(inpDay.value, 10);
        if(isNaN(y) || y < YEAR_MIN || y > YEAR_MAX) return;
        if(isNaN(m) || m < 1 || m > 12) return;
        if(isNaN(d) || d < 1 || d > daysInMonth(y, m)) return;
        state.y = y; state.m = m; state.d = d;
        calView.y = y; calView.m = m;
        render();
        renderCalendar();
        renderHuangli(y, m, d);
    }
    inpYear.addEventListener('input', function(){

    inpMonth.addEventListener('input', function(){

    function getLiuShen(dayGan) {

        var me = wuxing[dayGan], other = wuxing[otherGan];

        var relation = {
            '木': {'木':'兄弟','火':'子孙','土':'妻财','金':'官鬼','水':'父母'},
            '火': {'火':'兄弟','土':'子孙','金':'妻财','水':'官鬼','木':'父母'},

    function escapeHtml(s){

    // ============ 十二建除 ============
    function getJianChu(monthZhi, dayZhi){
        var mIdx = ZHI.indexOf(monthZhi);
        var dIdx = ZHI.indexOf(dayZhi);
        if(mIdx < 0 || dIdx < 0) return '—';
        var idx = (dIdx - mIdx + 12) % 12;
        return JIAN_CHU[idx];
    }

    // ============ 中栏：日历网格 ============
    function renderCalendar(){
        var y = calView.y, m = calView.m;
        calTitle.textContent = y + '年 ' + m + '月';

        var firstDay = new Date(y, m-1, 1).getDay();
        var daysInM = daysInMonth(y, m);
        var prevM = m - 1 < 1 ? 12 : m - 1;
        var prevY = m - 1 < 1 ? y - 1 : y;
        var prevDays = daysInMonth(prevY, prevM);

        var today = new Date();
        var todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();

        var html = '';
        var weekdayNames = ['日','一','二','三','四','五','六'];
        for(var w=0; w<7; w++){
            var cls = 'cal-weekday';
            if(w===0) cls += ' sun';
            if(w===6) cls += ' sat';
            html += '<div class="'+cls+'">'+weekdayNames[w]+'</div>';
        }

        for(var p=firstDay-1; p>=0; p--){
            var pd = prevDays - p;
            html += buildCalCell(prevY, prevM, pd, true, todayY, todayM, todayD);
        }
        for(var d=1; d<=daysInM; d++){
            html += buildCalCell(y, m, d, false, todayY, todayM, todayD);
        }
        var totalCells = firstDay + daysInM;
        var remaining = (7 - (totalCells % 7)) % 7;
        var nextM = m + 1 > 12 ? 1 : m + 1;
        var nextY = m + 1 > 12 ? y + 1 : y;
        for(var n=1; n<=remaining; n++){
            html += buildCalCell(nextY, nextM, n, true, todayY, todayM, todayD);
        }

        calendarGrid.innerHTML = html;

        var cells = calendarGrid.querySelectorAll('.cal-cell');
        cells.forEach(function(cell){
            cell.addEventListener('click', function(){
                var cy = parseInt(cell.dataset.y, 10);
                var cm = parseInt(cell.dataset.m, 10);
                var cd = parseInt(cell.dataset.d, 10);
                state.y = cy; state.m = cm; state.d = cd;
                inpYear.value = String(cy);
                inpMonth.value = cm < 10 ? '0'+cm : ''+cm;
                inpDay.value = cd < 10 ? '0'+cd : ''+cd;
                if(cm !== calView.m || cy !== calView.y){
                    calView.y = cy; calView.m = cm;
                    renderCalendar();
                } else {
                    calendarGrid.querySelectorAll('.cal-cell.selected').forEach(function(c){ c.classList.remove('selected'); });
                    cell.classList.add('selected');
                }
                render();
                renderHuangli(cy, cm, cd);
            });
        });
    }

    function buildCalCell(y, m, d, otherMonth, todayY, todayM, todayD){
        var lunar = lunarOf(y, m, d);
        var lunarDayStr = lunar.getDayInChinese();
        var dayGZ = lunar.getDayInGanZhi();
        var jieQi = lunar.getJieQi();

        var lunarStr = lunarDayStr;
        if(lunarStr === '初一'){
            lunarStr = lunar.getMonthInChinese() + '月';
        }

        var cls = 'cal-cell';
        if(otherMonth) cls += ' other-month';
        if(y === todayY && m === todayM && d === todayD) cls += ' today';
        if(y === state.y && m === state.m && d === state.d) cls += ' selected';
        // 应期高亮仅在扫描窗口（今日起365天）内生效
        var isYqMatch = yingqiParam && isWithinScanWindow(y, m, d) && isYingqiMatch(lunar);
        if(isYqMatch) cls += ' yingqi-match';
        // 择吉高亮（蓝色标记"吉"，区别于应期金色）
        var isZjMatch = isZejiMatch(y, m, d);
        if(isZjMatch && !isYqMatch) cls += ' zeji-match';

        var badge = '';
        if(isYqMatch){
            badge = '<span class="cal-badge">应</span>';
        } else if(isZjMatch){
            badge = '<span class="cal-badge" style="background:#2980b9;">吉</span>';
        }
        var jieqiHtml = jieQi ? '<span class="cal-jieqi">'+jieQi+'</span>' : '';

        return '<div class="'+cls+'" data-y="'+y+'" data-m="'+m+'" data-d="'+d+'">'+
            badge +
            '<span class="cal-solar">'+d+'</span>'+
            '<span class="cal-lunar">'+lunarStr+'</span>'+
            jieqiHtml +
            '</div>';
    }

    // ============ 应期反查 ============
    // 注意：lunar.js 月建以立春次日为界，非当日。
    // 系统口径以此为准：如2026年立春(2/4)当日月建仍为丑，2/5方入寅月。
    function parseYingqiParam(){
        var search = location.search;
        if(!search) return;
        var params = new URLSearchParams(search);
        var yq = params.get('yingqi');
        if(!yq) return;

        var re = /^([子丑寅卯辰巳午未申酉戌亥])月(([子丑寅卯辰巳午未申酉戌亥])日)?$/;
        var re2 = /^([子丑寅卯辰巳午未申酉戌亥])日$/;
        var match = yq.match(re);
        if(match){
            yingqiParam = { yueZhi: match[1], riZhi: match[3] || null };
        } else {
            var match2 = yq.match(re2);
            if(match2){
                yingqiParam = { yueZhi: null, riZhi: match2[1] };
            } else {
                // 非法参数：显示提示
                yingqiSection.style.display = '';
                yingqiTitle.textContent = '应期参数格式无法识别';
                yingqiList.innerHTML = '<div style="color:#b33;text-align:center;padding:16px;">参数「' + escapeHtml(yq) + '」格式无法识别。<br>正确格式如：寅月寅日、午月、卯日</div>';
            }
        }
    }

    function isYingqiMatch(lunar){
        if(!yingqiParam) return false;
        var monthZhi = lunar.getMonthZhiExact();
        var dayZhi = lunar.getDayInGanZhi().charAt(1);
        if(yingqiParam.yueZhi && yingqiParam.riZhi){
            return monthZhi === yingqiParam.yueZhi && dayZhi === yingqiParam.riZhi;
        }
        if(yingqiParam.yueZhi && !yingqiParam.riZhi){
            return monthZhi === yingqiParam.yueZhi;
        }
        if(!yingqiParam.yueZhi && yingqiParam.riZhi){
            return dayZhi === yingqiParam.riZhi;
        }
        return false;
    }

    // 检查日期是否在扫描窗口内（含起止）
    function isWithinScanWindow(y, m, d){
        if(!yingqiScanStart || !yingqiScanEnd) return false;
        var date = y * 10000 + m * 100 + d;
        var start = yingqiScanStart.y * 10000 + yingqiScanStart.m * 100 + yingqiScanStart.d;
        var end   = yingqiScanEnd.y * 10000 + yingqiScanEnd.m * 100 + yingqiScanEnd.d;
        return date >= start && date <= end;
    }

    function scanYingqi(){
        if(!yingqiParam) return;
        var today = new Date();
        var todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();
        // 设置扫描窗口
        yingqiScanStart = { y: todayY, m: todayM, d: todayD };
        var endDate = new Date(todayY, todayM-1, todayD + 365);
        yingqiScanEnd = { y: endDate.getFullYear(), m: endDate.getMonth()+1, d: endDate.getDate() };
        var matches = [];
        for(var i = 0; i <= 365; i++){
            var d = new Date(todayY, todayM-1, todayD + i);
            var y = d.getFullYear(), m = d.getMonth()+1, dd = d.getDate();
            var lunar = lunarOf(y, m, dd);
            if(isYingqiMatch(lunar)){
                matches.push({
                    y: y, m: m, d: dd,
                    week: WEEKDAYS[d.getDay()],
                    lunar: lunar.getMonthInChinese()+'月'+lunar.getDayInChinese(),
                    monthGZ: lunar.getMonthInGanZhiExact(),
                    dayGZ: lunar.getDayInGanZhi(),
                    diffDays: i
                });
            }
        }
        yingqiMatches = matches;
        renderYingqiResults();
        // 手机端自动展开应期 Sheet
        autoExpandSheet('yingqi');
        // 显示底部栏应期按钮
        if(mobileBarYingqi) mobileBarYingqi.style.display = '';
        // 桌面端：自动滚动到应期卡片，给出明确反馈（手机端由 Bottom Sheet 弹出承担）
        if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
            setTimeout(function(){
                try { yingqiSection.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
                catch(e) { yingqiSection.scrollIntoView(); }
            }, 120);
        }
    }

    function renderYingqiResults(){
        if(!yingqiParam) return;
        // 桌面端（>900px）强制显示应期卡片；手机端交由 Bottom Sheet 逻辑接管，勿用 important 覆盖
        if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
            yingqiSection.style.setProperty('display', 'block', 'important');
        } else {
            yingqiSection.style.display = '';
        }
        var paramStr = '';
        if(yingqiParam.yueZhi) paramStr += yingqiParam.yueZhi + '月';
        if(yingqiParam.riZhi) paramStr += yingqiParam.riZhi + '日';
        yingqiTitle.textContent = '应期反查：' + paramStr + '（共 ' + yingqiMatches.length + ' 个匹配日）';

        if(yingqiMatches.length === 0){
            yingqiList.innerHTML = '<div style="color:#9a8876;text-align:center;padding:16px;">365天内未找到符合条件之日期</div>';
            return;
        }

        var html = '';
        yingqiMatches.forEach(function(item, idx){
            var diffText = item.diffDays === 0 ? '今天' : '+' + item.diffDays + '天';
            html += '<div class="yingqi-item" data-y="'+item.y+'" data-m="'+item.m+'" data-d="'+item.d+'">'+
                '<span class="yi-idx">'+(idx+1)+'</span>'+
                '<span class="yi-date">'+item.y+'-'+p2(item.m)+'-'+p2(item.d)+'</span>'+
                '<span class="yi-week">星期'+item.week+'</span>'+
                '<span class="yi-lunar">'+item.lunar+'</span>'+
                '<span class="yi-gz">'+item.monthGZ+' '+item.dayGZ+'</span>'+
                '<span class="yi-diff">'+diffText+'</span>'+
            '</div>';
        });
        yingqiList.innerHTML = html;

        yingqiList.querySelectorAll('.yingqi-item').forEach(function(item){
            item.addEventListener('click', function(){
                var y = parseInt(item.dataset.y, 10);
                var m = parseInt(item.dataset.m, 10);
                var d = parseInt(item.dataset.d, 10);
                state.y = y; state.m = m; state.d = d;
                calView.y = y; calView.m = m;
                inpYear.value = String(y);
                inpMonth.value = m < 10 ? '0'+m : ''+m;
                inpDay.value = d < 10 ? '0'+d : ''+d;
                render();
                renderCalendar();
                renderHuangli(y, m, d);
            });
        });
    }

    // ============ 右栏：黄历通书 ============

    // ============ 自动定位 ============
    btnLoc.addEventListener('click', function(){
        locMsg.textContent = '定位中';
        locMsg.className = 'loc-status loading';

        function onSuccess(lng, name, type){
            state.lng = lng;
            state.placeName = name ? (name + (type==='gps'?'（GPS）':'（IP）')) : ('经度 '+lng.toFixed(2));
            state.locationType = type;
            var placeText = name ? name : ('经度 '+lng.toFixed(2)+'°E');
            locMsg.textContent = '✅ 定位成功　' + placeText + '　经度 ' + lng.toFixed(2) + '°E　真太阳时已重新计算';
            locMsg.className = 'loc-status success';
            render();
        }
        function tryIp(i){
            var apis = [
                { url:'https://ipwho.is/',
                  parse:function(j){ return j.longitude!=null ? {lng:+j.longitude, name:(j.city||j.region||j.country||'当前城市')} : null; } },
                { url:'https://ipapi.co/json/?lang=zh-CN',
                  parse:function(j){ return j.longitude!=null ? {lng:+j.longitude, name:(j.city||j.region||j.country_name||'当前城市')} : null; } }
            ];
            if(i >= apis.length){
                locMsg.textContent = '⚠️ GPS 与 IP 定位均失败，已使用默认北京基准（116.46°E）';
                locMsg.className = 'loc-status';
                state.placeName = '北京基准（默认）';
                state.locationType = 'fallback';
                render();
                return;
            }
            var api = apis[i];
            locMsg.textContent = 'IP 定位中…（源 '+(i+1)+'/'+apis.length+'）';
            fetch(api.url, {method:'GET', cache:'no-store', mode:'cors'})
                .then(function(r){
                    if(!r.ok) throw new Error('http '+r.status);
                    return r.json();
                })
                .then(function(j){
                    var p = api.parse(j);
                    if(!p || isNaN(p.lng)) throw new Error('no-lng');
                    onSuccess(p.lng, p.name, 'ip');
                })
                .catch(function(){
                    tryIp(i+1);
                });
        }
        function tryGps(){
            if(!navigator.geolocation){
                locMsg.textContent = '当前环境不支持 GPS，改用 IP 定位…';
                return tryIp(0);
            }
            navigator.geolocation.getCurrentPosition(function(pos){
                var lat = pos.coords.latitude, lng = pos.coords.longitude;
                reverseGeocode(lat, lng, function(city){
                    onSuccess(lng, city, 'gps');
                });
            }, function(){
                locMsg.textContent = 'GPS 不可用，改用 IP 定位…';
                tryIp(0);
            }, { enableHighAccuracy:false, timeout:6000, maximumAge:600000 });
        }
        function reverseGeocode(lat, lng, cb){
            var url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='
                + lat + '&longitude=' + lng + '&localityLanguage=zh';
            fetch(url, {method:'GET', cache:'no-store', mode:'cors'})
                .then(function(r){ return r.json(); })
                .then(function(j){
                    var city = j.city || j.locality || j.principalSubdivision || null;
                    cb(city);
                })
                .catch(function(){ cb(null); });
        }
        tryGps();
    });

    // URL ?zeji= 参数解析
    function parseZejiParam(){
        var search = location.search;
        if(!search) return;
        var params = new URLSearchParams(search);
        var zj = params.get('zeji');
        if(!zj) return;

        if(zj === 'tstj'){
            // 联卦模式：从 localStorage.tstj_zeji 读取
            var raw = null;
            try { raw = localStorage.getItem('tstj_zeji'); } catch(e) { return; }
            if(!raw){
                zejiHint.textContent = '联卦数据已失效，请从释卦页重新发起。';
                zejiHint.style.display = '';
                return;
            }
            var ti = null;
            try { ti = JSON.parse(raw); } catch(e) { return; }
            if(!ti || !ti.yongShenDizhi){
                zejiHint.textContent = '联卦数据缺少 yongShenDizhi，无法计算用神旺衰。';
                zejiHint.style.display = '';
                return;
            }
            // 自动选中事项
            var cat = QUESTION_TO_CATEGORY[ti.questionType] || '';
            if(cat){
                for(var i = 0; i < zejiCategory.options.length; i++){
                    if(zejiCategory.options[i].value === cat){
                        zejiCategory.selectedIndex = i;
                        break;
                    }
                }
            }
            zejiParam = {
                category: cat,
                useShenWang: true,
                yongShenDizhi: ti.yongShenDizhi,
                yongShenLiuqin: ti.yongShenLiuqin || '',
                guaName: ti.guaName || '',
                question: ti.question || '',
                wangShuaiScore: ti.wangShuaiScore || 0
            };
            zejiMode = 'liangua';
            // 消费后删除
            try { localStorage.removeItem('tstj_zeji'); } catch(e) {}
            // 显示联卦信息
            zejiHint.innerHTML = '🔮 联卦模式：' + (ti.guaName||'') + ' · 用神 ' + (ti.yongShenLiuqin||'') +
                '（' + ti.yongShenDizhi + '）· 卦象旺衰 ' + (ti.wangShuaiScore||0) + '分';
            zejiHint.style.display = '';
            // 自动扫描
            if(cat) setTimeout(function(){ doScanZeji(cat); }, 100);
        } else if(ZEJI_CATEGORIES[zj]){
            // 纯事项模式
            for(var i = 0; i < zejiCategory.options.length; i++){
                if(zejiCategory.options[i].value === zj){
                    zejiCategory.selectedIndex = i;
                    break;
                }
            }
            zejiParam = { category: zj, useShenWang: false };
            zejiMode = 'plain';
            setTimeout(function(){ doScanZeji(zj); }, 100);
        }
    }

    // 扫描引擎
    function scanZeji(category, scanDays, useShenWang){
        var cat = ZEJI_CATEGORIES[category];
        if(!cat) return;
        var yiWords = cat.yi;
        var jiWords = cat.ji;

        var today = new Date();
        var todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();
        zejiScanStart = { y: todayY, m: todayM, d: todayD };
        var endDate = new Date(todayY, todayM-1, todayD + scanDays);
        zejiScanEnd = { y: endDate.getFullYear(), m: endDate.getMonth()+1, d: endDate.getDate() };

        var matches = [];
        for(var i = 0; i <= scanDays; i++){
            var d = new Date(todayY, todayM-1, todayD + i);
            var y = d.getFullYear(), m = d.getMonth()+1, dd = d.getDate();
            var lunar = lunarOf(y, m, dd);
            var dayYi = lunar.getDayYi();
            var dayJi = lunar.getDayJi();

            // 检查宜含目标词
            var yiMatch = false;
            for(var j = 0; j < yiWords.length; j++){
                if(dayYi.indexOf(yiWords[j]) >= 0){ yiMatch = true; break; }
            }
            if(!yiMatch) continue; // 不入围则跳过

            // 检查忌含冲词
            var jiMatch = false;
            for(var j = 0; j < jiWords.length; j++){
                if(dayJi.indexOf(jiWords[j]) >= 0){ jiMatch = true; break; }
            }

            // 评分
            var score = scoreZeji(lunar, dayYi, dayJi, jiMatch, useShenWang, y, m, dd);
            matches.push({
                y: y, m: m, d: dd,
                week: WEEKDAYS[d.getDay()],
                lunar: lunar.getMonthInChinese()+'月'+lunar.getDayInChinese(),
                dayGZ: lunar.getDayInGanZhi(),
                jianChu: getJianChu(lunar.getMonthZhiExact(), lunar.getDayInGanZhi().charAt(1)),
                yiList: dayYi.slice(0, 5),
                jiList: dayJi.slice(0, 3),
                chong: lunar.getDayChongDesc(),
                jiShenCount: lunar.getDayJiShen().length,
                score: score.score,
                grade: score.grade,
                detail: score.detail, diffDays: i
            });
        }
        // 按距离今日天数升序（最近优先）
        matches.sort(function(a, b){ return a.diffDays - b.diffDays; });
        zejiMatches = matches;
        renderZejiResults(category, scanDays, useShenWang);
        renderCalendar(); // 刷新日历高亮
        // 手机端自动展开择吉 Sheet
        autoExpandSheet('zeji');
    }

    // 评分模型
    function scoreZeji(lunar, dayYi, dayJi, jiMatch, useShenWang, y, m, d){
        var monthZhi = lunar.getMonthZhiExact();
        var dayZhi = lunar.getDayInGanZhi().charAt(1);
        var jc = getJianChu(monthZhi, dayZhi);

        // 维度1：建除
        var jcScore = JIANCHU_SCORE[jc] || 0;

        // 维度2：吉神
        var jiShen = lunar.getDayJiShen();
        var jsScore = 0;
        for(var i = 0; i < jiShen.length; i++){
            jsScore += JI_SHEN_WEIGHT[jiShen[i]] || 1;
        }
        jsScore = Math.min(jsScore, 25); // 封顶25

        // 维度3：凶煞
        var xiongSha = lunar.getDayXiongSha();
        var xsScore = 0;
        for(var i = 0; i < xiongSha.length; i++){
            xsScore += XIONG_SHA_WEIGHT[xiongSha[i]] || 0;
        }
        xsScore = Math.max(xsScore, -20); // 底线-20，转正后为0

        // 维度4：冲煞（本命生肖）
        var dayChong = lunar.getDayChong(); // 冲某地支
        var chongScore = 15; // 默认不冲
        // 若用户有生肖（从 state 或 zejiParam）
        var userZhi = '';
        if(state.userZhi) userZhi = state.userZhi;
        if(userZhi && dayChong === userZhi) chongScore = 0;

        // 维度5：宜忌
        var yiScore = 15; // 目标事项在宜
        if(jiMatch) yiScore = 5; // 宜忌并存扣分

        // 维度6：用神旺衰（仅联卦模式）
        var wsScore = 0;
        if(useShenWang && zejiParam && zejiParam.yongShenDizhi){
            // 构造虚拟爻对象，调用 suanfa.js 的 jiWangShuaiScore
            var fakeYao = { dizhi: zejiParam.yongShenDizhi, isDong: false, kongType: 'none', yuePo: false };
            var fakeGuaInfo = {
                timeInfo: {
                    yueJian: lunar.getMonthZhiExact(),
                    riChen: lunar.getDayInGanZhi()
                },
                yaoDetail: [fakeYao]
            };
            var ws = jiWangShuaiScore(fakeYao, fakeGuaInfo);
            // 原始分约 -60~60，映射为 0~20
            wsScore = Math.round(((ws.score || 0) + 60) / 120 * 20);
            wsScore = Math.max(0, Math.min(20, wsScore));
        }

        // 合计
        var total;
        if(useShenWang){
            // 联卦模式：六维，各维度等比压缩至80%+用神20%
            total = Math.round(
                jcScore * 0.8 + jsScore * 0.8 + (xsScore + 20) * 0.8 +
                chongScore * 0.8 + yiScore * 0.8 + wsScore
            );
        } else {
            // 纯事项模式：五维满分100
            total = Math.round(jcScore + jsScore + (xsScore + 20) + chongScore + yiScore);
        }
        total = Math.max(0, Math.min(100, total));

        // 分档
        var grade = total >= 80 ? '🌟🌟🌟' : (total >= 60 ? '🌟🌟' : '🌟');

        return { score: total, grade: grade, detail: '建除:' + jc + ' 吉神:' + jiShen.length + ' 凶煞:' + xiongSha.length + ' 冲:' + dayChong };
    }

    // 择吉结果列表渲染
    function renderZejiResults(category, scanDays, useShenWang){
        var cat = ZEJI_CATEGORIES[category];
        // 桌面端（>900px）强制显示择吉结果卡片；手机端交由 Bottom Sheet 逻辑接管
        if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
            zejiResultSection.style.setProperty('display', 'block', 'important');
        } else {
            zejiResultSection.style.display = '';
        }
        var modeStr = useShenWang ? '联卦择吉' : '纯事项择吉';
        zejiResultTitle.textContent = '择吉结果：' + category + '（' + cat.desc + '）' +
            ' · ' + modeStr + ' · 扫描' + scanDays + '天 · 共' + zejiMatches.length + '个入围日';

        if(zejiMatches.length === 0){
            zejiResultList.innerHTML = '<div style="color:#9a8876;text-align:center;padding:16px;">' + scanDays + '天内未找到宜' + category + '之日期</div>';
            return;
        }

        var html = '';
        var showCount = Math.min(zejiMatches.length, 15); // 最多展示15个
        for(var i = 0; i < showCount; i++){
            var item = zejiMatches[i];
            var diffDays = Math.round((new Date(item.y, item.m-1, item.d) - new Date(zejiScanStart.y, zejiScanStart.m-1, zejiScanStart.d)) / 86400000);
            var diffText = diffDays === 0 ? '今天' : '+' + diffDays + '天';
            html += '<div class="yingqi-item" data-y="'+item.y+'" data-m="'+item.m+'" data-d="'+item.d+'" style="grid-template-columns: 30px 30px 1fr 44px 1fr 44px 50px;">' +
                '<span class="yi-idx">'+(i+1)+'</span>' +
                '<span style="font-size:11px;">'+item.grade+'</span>' +
                '<span class="yi-date">'+item.y+'-'+p2(item.m)+'-'+p2(item.d)+'</span>' +
                '<span class="yi-week">星期'+item.week+'</span>' +
                '<span class="yi-lunar">'+item.lunar+' '+item.jianChu+' '+item.dayGZ+'</span>' +
                '<span class="yi-gz">'+item.score+'分</span>' +
                '<span class="yi-diff">'+diffText+'</span>' +
            '</div>';
        }
        if(zejiMatches.length > showCount){
            html += '<div style="font-size:12px;color:#a48d78;text-align:center;padding:8px;">还有 ' + (zejiMatches.length - showCount) + ' 个日期未展示（已按距离今日天数排序，最近优先）</div>';
        }
        zejiResultList.innerHTML = html;

        // 绑定点击
        zejiResultList.querySelectorAll('.yingqi-item').forEach(function(item){
            item.addEventListener('click', function(){
                var y = parseInt(item.dataset.y, 10);
                var m = parseInt(item.dataset.m, 10);
                var d = parseInt(item.dataset.d, 10);
                state.y = y; state.m = m; state.d = d;
                calView.y = y; calView.m = m;
                inpYear.value = String(y);
                inpMonth.value = m < 10 ? '0'+m : ''+m;
                inpDay.value = d < 10 ? '0'+d : ''+d;
                render();
                renderCalendar();
                renderHuangli(y, m, d);
            });
        });
        // 桌面端：自动滚动到择吉结果卡片，给出明确反馈（手机端由 Bottom Sheet 弹出承担）
        if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
            setTimeout(function(){
                try { zejiResultSection.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
                catch(e) { zejiResultSection.scrollIntoView(); }
            }, 120);
        }
    }

    // 择吉日历高亮检查
    function isZejiMatch(y, m, d){
        if(!zejiMatches || zejiMatches.length === 0) return false;
        if(!isWithinZejiScanWindow(y, m, d)) return false;
        for(var i = 0; i < zejiMatches.length; i++){
            if(zejiMatches[i].y === y && zejiMatches[i].m === m && zejiMatches[i].d === d) return true;
        }
        return false;
    }
    function isWithinZejiScanWindow(y, m, d){
        if(!zejiScanStart || !zejiScanEnd) return false;
        var date = y * 10000 + m * 100 + d;
        var start = zejiScanStart.y * 10000 + zejiScanStart.m * 100 + zejiScanStart.d;
        var end   = zejiScanEnd.y * 10000 + zejiScanEnd.m * 100 + zejiScanEnd.d;
        return date >= start && date <= end;
    }

    // ============ 初始化 ============
    function init(){
        var now = new Date();
        state.y = now.getFullYear();
        state.m = now.getMonth()+1;
        state.d = now.getDate();
        state.h = now.getHours();
        state.mi = now.getMinutes();

        calView.y = state.y;
        calView.m = state.m;

        fillTimeSelects();
        selHour.value = state.h;
        selMin.value = state.mi;

        inpYear.value = String(state.y);
        inpMonth.value = state.m < 10 ? '0' + state.m : '' + state.m;
        inpDay.value = state.d < 10 ? '0' + state.d : '' + state.d;

        parseYingqiParam();
        parseZejiParam();

        render();
        renderCalendar();
        renderHuangli(state.y, state.m, state.d);

        if(yingqiParam){
            scanYingqi();
            if(yingqiMatches.length > 0){
                var first = yingqiMatches[0];
                calView.y = first.y;
                calView.m = first.m;
                renderCalendar();
            }
        }

        console.log('✅ 天时通鉴已加载');
    }

    if(window.Solar){
        init();
    }else{
        resultArea.innerHTML = '<div style="color:#b33;text-align:center;padding:20px;">⚠️ lunar.js 未加载，无法排盘</div>';
        huangliPanel.innerHTML = '<div class="hl-placeholder">⚠️ lunar.js 未加载</div>';
    }

    // 移动端：将"回到今日"卡片移至公历日期输入上方（桌面零改动，仅 ≤900px 生效）
    (function(){
        var todayCard = document.querySelector('.today-card');
        var tstjLeft = document.querySelector('.tstj-left');
        var tstjCenter = document.querySelector('.tstj-center');
        if(!todayCard || !tstjLeft || !tstjCenter) return;
        var mq = window.matchMedia('(max-width: 900px)');
        function placeToday(){
            if(mq.matches){ tstjLeft.insertBefore(todayCard, tstjLeft.firstChild); }
            else { tstjCenter.insertBefore(todayCard, tstjCenter.firstChild); }
        }
        if(mq.addEventListener) mq.addEventListener('change', placeToday);
        else if(mq.addListener) mq.addListener(placeToday);
        placeToday();
    })();
})();
</script>
